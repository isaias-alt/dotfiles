onboarding = false

[theme]
# Follow WezTerm's active color_scheme instead of a fixed built-in theme,
# so herdr's own chrome (status bar, borders, tabs) matches whatever we're
# auditioning in wezterm.lua.
name = "terminal"

[theme.custom]
# The "terminal" theme leaves panel_bg as Reset, which makes herdr derive the
# focused tab label from surface_dim (ANSI bright black, #657b83 here). That
# lands at 1.21:1 contrast against the blue accent, so the tab number is
# unreadable. Pinning panel_bg to the terminal background makes the label use
# #001419 on #268bd3 (5.13:1) instead, while looking identical everywhere else
# because panel_bg already resolves to that same background.
panel_bg = "#001419"

[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+minus"
split_vertical    = "prefix+v"
new_tab   = "prefix+c"
close_tab = "prefix+shift+x"
workspace_picker = "prefix+w"
previous_workspace = "prefix+["
next_workspace      = "prefix+]"
switch_workspace = "prefix+shift+1..9"  # indexed: prefix+shift+N jumps straight to workspace N
previous_agent = "prefix+comma"
next_agent      = "prefix+period"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"