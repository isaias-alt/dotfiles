onboarding = false

[theme]
# "terminal" keeps herdr's fallback palette anchored to the host terminal's
# ANSI colors. The explicit pins below then take over the chrome with the exact
# Atom Just Black UI values, so herdr keeps the Atom Just Black identity even
# when wezterm is auditioning a different color_scheme.
name = "terminal"

[theme.custom]
# Atom Just Black: values traced to the VS Code theme's `colors.*` keys,
# same ground truth as ~/.config/wezterm/colors/atom-just-black.toml.
panel_bg = "#000000" # editor.background (also gives the focused tab label 6.5:1 on the accent)
sidebar_bg = "#000000" # sideBar.background
active_row_bg = "#2c313a" # list.activeSelectionBackground
selection_bg = "#3e4451" # editor.selectionBackground
surface0 = "#21252b" # notification.background
surface1 = "#2c313a" # editorSuggestWidget.selectedBackground
surface_dim = "#181a1f" # editorHoverWidget.border
overlay0 = "#636d83" # editorLineNumber.foreground
overlay1 = "#9da5b4" # statusBar.foreground
text = "#abb2bf" # editor.foreground
subtext0 = "#7d7d80" # sideBar.foreground
accent = "#528bff" # editorCursor.foreground
mauve = "#c678dd" # keyword
green = "#98c379" # string
yellow = "#e5c07b" # entity.name.type
red = "#e06c75" # variable
blue = "#61afef" # entity.name.function
teal = "#56b6c2" # support.type
peach = "#d19a66" # constant.numeric

[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+minus"
split_vertical    = "prefix+v"
new_tab   = "prefix+c"
close_tab = "prefix+shift+x"
workspace_picker = "prefix+w"
previous_workspace = "prefix+["
next_workspace      = "prefix+]"
switch_workspace = "prefix+shift+1..9"  # indexed: prefix+shift+N jumps straight to workspace N
previous_agent = "prefix+comma"
next_agent      = "prefix+period"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"